name: TunnelMaster macOS integration

on:
  push:
    branches: [codex/verge]
    paths:
      - .github/workflows/tunnelmaster-macos.yml
      - scripts/test-macos-tun.sh
      - scripts/prebuild.mjs
      - src/**
      - src-tauri/**
      - vendor/tunnelmaster-service/**
      - Cargo.lock
      - pnpm-lock.yaml

permissions:
  contents: read

concurrency:
  group: tunnelmaster-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tun:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '26.13.0'
          cache: pnpm
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Restore Rust build dependencies
        id: rust-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: tm-macos-arm64-${{ hashFiles('Cargo.lock', 'vendor/tunnelmaster-service/Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: tm-macos-arm64-${{ hashFiles('Cargo.lock', 'vendor/tunnelmaster-service/Cargo.lock', 'rust-toolchain.toml') }}-
      - name: Build TunnelMaster and the privileged service
        run: |
          pnpm install --frozen-lockfile
          pnpm prebuild aarch64-apple-darwin
          pnpm tauri build --debug --bundles app
          codesign --force --deep --sign - target/debug/bundle/macos/TunnelMaster.app
          codesign --verify --deep --strict target/debug/bundle/macos/TunnelMaster.app
      - name: Save Rust build dependencies
        if: steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Exercise production service IPC and the real TUN interface
        run: |
          bash scripts/test-macos-tun.sh target/debug/bundle/macos/TunnelMaster.app \
            target/bundled-service/aarch64-apple-darwin/release/service-integration-driver
